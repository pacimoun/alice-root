# Скопируйте в config.local.toml (игнорируется Git), заполните свои значения.
[station]
host = "STATION_HOST"
port = 2222
user = "root"
identity = "~/.ssh/alice_station_ed25519"
bluetooth_mac = "AA:BB:CC:DD:EE:FF"
model = "yandexmini_2"
firmware = "0.369.1.46.4778262943.20261013.299"
abi = "armhf"

# Необязательные пути. Без overrides используются XDG и Path.home().
