# Только для подготовки НОВОЙ колонки: python3 scripts/rooting.py
[rooting]
pc_ip = "PC_LAN_IP"
router_ip = "ROUTER_LAN_IP"
wifi_mac = "AA:BB:CC:DD:EE:FF" # Wi-Fi MAC; Bluetooth MAC находится выше
firewall_zone = "" # пусто = определить по интерфейсу с pc_ip
