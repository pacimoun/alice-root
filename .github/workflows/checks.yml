name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xauth pipewire-pulse
      - name: User systemd environment
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/alice-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/alice-runtime" >> "$GITHUB_ENV"
      - name: Build and fetch test inputs
        run: |
          python3 scripts/fetch-integration-fixtures.py --destination "$PWD/.cache/fixtures"
          python3 scripts/build-agent.py --fetch --host-tests --work-dir "$PWD/.cache/build-agent"
          python3 scripts/alice.py fetch > "$RUNNER_TEMP/alice-release.json"
      - name: Python and C tests
        env:
          ALICE_INTEGRATION_FIXTURES: ${{ github.workspace }}/.cache/fixtures
          ALICE_AGENT_TEST_DIR: ${{ github.workspace }}/.cache/build-agent
          ALICE_MUSIC_AGENT: ${{ github.workspace }}/.cache/build-agent/native_agent_music.so
        run: |
          export ALICE_RELEASE_ARCHIVE="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/alice-release.json"))["file"])')"
          python3 -m unittest discover -s tests -v
      - run: npm ci && npm test
      - run: python3 scripts/check-repository.py
