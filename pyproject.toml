[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-root"
version = "0.1.0"
description = "Bluetooth, GPT bridge и SoundCloud для Станции Мини 2"
requires-python = ">=3.11"

[project.scripts]
alice-root = "alice_root.cli:main"
verity-sc = "alice_root.soundcloud:main"

[tool.setuptools.packages.find]
where = ["src"]
